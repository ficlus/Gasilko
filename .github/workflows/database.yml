name: Database
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - run: supabase start
      - run: supabase db reset --local
      - name: Verify seed can be applied repeatedly
        run: |
          docker exec -i supabase_db_gasilko psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/seed.sql
          docker exec -i supabase_db_gasilko psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/seed.sql
      - run: supabase db lint --local --level warning
      - run: supabase test db
      - name: Real local Auth signup, session and RLS integration
        run: node supabase/tests/auth.integration.mjs
      - name: Review and last-admin concurrency
        run: node supabase/tests/review.concurrency.mjs
      - name: Hydrant code allocation concurrency
        run: node supabase/tests/hydrant.concurrency.mjs
      - name: Hydrant Auth and REST authorization
        run: node supabase/tests/hydrant.authorization.integration.mjs
      - name: Hydrant authorization and version concurrency
        run: node supabase/tests/hydrant.authorization.concurrency.mjs
      - if: always()
        run: supabase stop --no-backup
